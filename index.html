<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaaldarpan | Vedic Panchang</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #faf7f0;
  color: #2d2118;
  font-family: Arial, sans-serif;
}

/* HEADER */

.header {
  height: 72px;
  background: #fffdf8;
  border-bottom: 1px solid #eee4d4;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 18px;
}

.brand-area {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 45px;
  height: 45px;
  object-fit: contain;
}

.brand {
  font-family: Georgia, serif;
  font-size: 23px;
  color: #8b520f;
}

.menu-button {
  width: 43px;
  height: 43px;

  border: 1px solid #dfcba9;
  border-radius: 9px;

  background: white;

  font-size: 23px;
  color: #76501d;

  cursor: pointer;
}

/* MENU */

.menu {
  display: none;

  position: absolute;
  top: 72px;
  right: 12px;

  width: 235px;

  background: white;

  border: 1px solid #e4d6bf;
  border-radius: 12px;

  box-shadow: 0 8px 25px rgba(60,40,20,.12);

  z-index: 1000;
}

.menu.open {
  display: block;
}

.menu a {
  display: block;

  padding: 15px 18px;

  text-decoration: none;

  color: #4d3b29;

  font-size: 14px;

  border-bottom: 1px solid #f0e8db;
}

.menu a:last-child {
  border-bottom: none;
}

.menu a:hover {
  background: #fff8eb;
}

/* HERO */

.hero {
  text-align: center;

  padding: 45px 18px 25px;
}

.om {
  font-size: 27px;
  color: #a96a16;
}

h1 {
  margin: 10px 0;

  font-family: Georgia, serif;

  font-size: 36px;
  font-weight: normal;

  color: #3d2a1b;
}

.subtitle {
  max-width: 650px;

  margin: auto;

  color: #776a5d;

  font-size: 14px;

  line-height: 1.7;
}

.date {
  margin-top: 16px;

  color: #8a6a40;

  font-size: 13px;
}

/* PANCHANG */

.container {
  width: min(94%, 900px);

  margin: auto;

  padding-bottom: 60px;
}

.card {
  background: white;

  border: 1px solid #eee3d1;

  border-radius: 14px;

  padding: 25px;

  margin-bottom: 18px;
}

.card-title {
  margin: 0 0 18px;

  font-family: Georgia, serif;

  font-size: 22px;

  font-weight: normal;

  color: #86500f;
}

.row {
  display: flex;

  justify-content: space-between;

  gap: 20px;

  padding: 12px 0;

  border-bottom: 1px solid #f0e8dc;

  font-size: 14px;
}

.row:last-child {
  border-bottom: none;
}

.label {
  color: #766756;
}

.value {
  text-align: right;

  color: #3f3022;
}

/* LOADING */

.loading {
  text-align: center;

  padding: 35px;

  color: #8a7b6b;

  font-size: 14px;
}

/* FOOTER */

footer {
  text-align: center;

  padding: 25px;

  background: #f1e7d7;

  color: #806f5c;

  font-size: 12px;
}

footer strong {
  color: #8b520f;
}

/* MOBILE */

@media (max-width: 600px) {

  h1 {
    font-size: 30px;
  }

  .card {
    padding: 20px;
  }

}

</style>
</head>


<body>


<!-- HEADER -->

<header class="header">

  <div class="brand-area">

    <img
      src="assets/kaaldarpan-logo.png"
      class="logo"
      alt="Kaaldarpan"
    >

    <div class="brand">
      Kaaldarpan
    </div>

  </div>


  <button
    class="menu-button"
    onclick="toggleMenu()"
    aria-label="Open menu">

    ☰

  </button>

</header>


<!-- MENU -->

<div
  class="menu"
  id="menu">

  <a href="index.html">
    🏠 Panchang
  </a>

  <a href="horoscope.html">
    🔮 Daily Horoscope
  </a>

  <a href="transits.html">
    🪐 Planetary Transits
  </a>

  <a href="muhurat.html">
    🕉️ Muhurat
  </a>

  <a href="about.html">
    ℹ️ About Kaaldarpan
  </a>

</div>


<!-- HERO -->

<section class="hero">

  <div class="om">
    ॐ
  </div>

  <h1>
    Today's Panchang
  </h1>

  <p class="subtitle">
    Vedic Panchang calculated using the Mauksh
    Panchang Engine and Swiss Ephemeris.
  </p>

  <div
    class="date"
    id="date">
  </div>

</section>


<!-- PANCHANG -->

<main class="container">


  <div class="card">

    <h2 class="card-title">
      Panchang
    </h2>

    <div id="panchang">

      <div class="loading">
        Loading today's Panchang...
      </div>

    </div>

  </div>


</main>


<!-- FOOTER -->

<footer>

  <strong>
    Kaaldarpan
  </strong>

  <br>

  An initiative by Mauksh

</footer>


<script>


/* MENU */

function toggleMenu() {

  document
    .getElementById("menu")
    .classList
    .toggle("open");

}


/* DATE */

document.getElementById("date").textContent =
new Date().toLocaleDateString(
  "en-IN",
  {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  }
);


/*
  IMPORTANT

  Keep your existing live Panchang

  your existing Panchang engine.
*/


</script>


</body>
</html>
