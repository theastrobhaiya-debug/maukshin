<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaaldarpan | Vedic Panchang</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #faf7f0;
  color: #33261b;
  font-family: Arial, sans-serif;
}

/* HEADER */

header {
  height: 74px;
  padding: 0 18px;
  background: #fffdf8;
  border-bottom: 1px solid #eadfce;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
}

.brand-name {
  font-family: Georgia, serif;
  font-size: 24px;
  color: #8b520f;
}

/* MENU BUTTON */

.menu-button {
  width: 43px;
  height: 43px;

  background: #fff;
  border: 1px solid #ddccb0;
  border-radius: 9px;

  font-size: 23px;
  color: #76501d;

  cursor: pointer;
}

/* MENU */

.menu {
  display: none;

  position: absolute;
  right: 15px;
  top: 68px;

  width: 245px;

  background: #fff;

  border: 1px solid #e4d7c3;
  border-radius: 12px;

  box-shadow: 0 10px 28px rgba(60,40,20,.12);

  z-index: 1000;
}

.menu.open {
  display: block;
}

.menu a {
  display: block;

  padding: 16px 18px;

  text-decoration: none;

  color: #4d3b29;

  font-size: 14px;

  border-bottom: 1px solid #f0e8dc;
}

.menu a:last-child {
  border-bottom: none;
}

.menu a:hover {
  background: #fff8ec;
}

/* HERO */

.hero {
  text-align: center;
  padding: 42px 18px 28px;
}

.om {
  font-size: 27px;
  color: #a96a16;
}

h1 {
  margin: 9px 0;

  font-family: Georgia, serif;
  font-size: 36px;
  font-weight: normal;

  color: #3d2a1b;
}

.subtitle {
  max-width: 650px;
  margin: auto;

  color: #776a5d;
  font-size: 14px;
  line-height: 1.7;
}

/* CONTROLS */

.container {
  width: min(94%, 760px);
  margin: auto;
  padding-bottom: 60px;
}

.controls {
  background: #fff;

  border: 1px solid #eadfce;
  border-radius: 14px;

  padding: 22px;

  margin-bottom: 22px;
}

.field {
  margin-bottom: 17px;
}

.field:last-child {
  margin-bottom: 0;
}

label {
  display: block;

  margin-bottom: 7px;

  font-size: 13px;
  color: #665747;
}

input,
select {
  width: 100%;

  padding: 13px 14px;

  border: 1px solid #d8c6a8;
  border-radius: 9px;

  background: #fff;

  color: #3d3024;

  font-size: 14px;

  outline: none;
}

button.get-panchang {
  width: 100%;

  margin-top: 4px;

  padding: 14px;

  border: none;
  border-radius: 9px;

  background: #8b520f;
  color: white;

  font-size: 14px;

  cursor: pointer;
}

button.get-panchang:hover {
  background: #75440b;
}

/* RESULT */

.result {
  background: #fff;

  border: 1px solid #eadfce;
  border-radius: 14px;

  padding: 25px;
}

.result-title {
  margin: 0 0 20px;

  text-align: center;

  font-family: Georgia, serif;
  font-size: 24px;
  font-weight: normal;

  color: #86500f;
}

.section {
  margin-top: 24px;
  padding-top: 18px;

  border-top: 1px solid #eee4d5;
}

.section:first-child {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}

.section h2 {
  margin: 0 0 10px;

  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: normal;

  color: #86500f;
}

.row {
  display: flex;
  justify-content: space-between;

  gap: 20px;

  padding: 9px 0;

  font-size: 14px;
}

.row .label {
  color: #786a5b;
}

.row .value {
  text-align: right;
  color: #3d3024;
}

.loading {
  text-align: center;
  padding: 30px 10px;

  color: #897a69;
  font-size: 14px;
}

/* FOOTER */

footer {
  text-align: center;

  padding: 26px 15px;

  background: #f1e7d7;

  color: #806f5c;

  font-size: 12px;
}

footer strong {
  color: #8b520f;
}

@media(max-width:600px) {

  h1 {
    font-size: 30px;
  }

  .result {
    padding: 20px;
  }

  .controls {
    padding: 18px;
  }
}
</style>
</head>


<body>


<!-- HEADER -->

<header>

  <div class="brand">

    <img
      src="assets/kaaldarpan-logo.png"
      class="logo"
      alt="Kaaldarpan"
    >

    <div class="brand-name">
      Kaaldarpan
    </div>

  </div>


  <button
    class="menu-button"
    onclick="toggleMenu()"
    aria-label="Menu">

    ☰

  </button>

</header>


<!-- MENU -->

<div
  class="menu"
  id="menu">

  <a href="horoscope.html">
    🔮 Daily Horoscope
  </a>

  <a href="monthly-horoscope.html">
    📅 Monthly Horoscope
  </a>

  <a href="yearly-horoscope.html">
    ✨ Yearly Horoscope
  </a>

  <a href="founder.html">
    👤 Our Founder
  </a>

</div>


<!-- HERO -->

<section class="hero">

  <div class="om">
    ॐ
  </div>

  <h1>
    Today's Panchang
  </h1>

  <p class="subtitle">
    Vedic Panchang calculated using the
    Mauksh Panchang Engine.
  </p>

</section>


<!-- MAIN -->

<main class="container">


  <!-- DATE + LOCATION -->

  <div class="controls">

    <div class="field">

      <label for="date">
        Date
      </label>

      <input
        type="date"
        id="date"
      >

    </div>


    <div class="field">

      <label for="location">
        Location
      </label>

      <select id="location">

        <option value="30.0869,78.2676,Asia/Kolkata">
          Rishikesh
        </option>

        <option value="28.6139,77.2090,Asia/Kolkata">
          New Delhi
        </option>

        <option value="19.0760,72.8777,Asia/Kolkata">
          Mumbai
        </option>

        <option value="12.9716,77.5946,Asia/Kolkata">
          Bengaluru
        </option>

        <option value="22.5726,88.3639,Asia/Kolkata">
          Kolkata
        </option>

        <option value="13.0827,80.2707,Asia/Kolkata">
          Chennai
        </option>

      </select>

    </div>


    <button
      class="get-panchang"
      onclick="loadPanchang()">

      Get Panchang

    </button>

  </div>


  <!-- RESULT -->

  <div
    class="result"
    id="result">

    <div class="loading">
      Select a date and location to view Panchang.
    </div>

  </div>


</main>


<!-- FOOTER -->

<footer>

  <strong>
    Kaaldarpan
  </strong>

  <br>

  An initiative by Mauksh

</footer>


<script>

/*
--------------------------------------------------
MENU
--------------------------------------------------
*/

function toggleMenu() {

  document
    .getElementById("menu")
    .classList
    .toggle("open");

}


/*
--------------------------------------------------
DEFAULT DATE
--------------------------------------------------
*/

const dateInput =
  document.getElementById("date");

const today =
  new Date();

const yyyy =
  today.getFullYear();

const mm =
  String(today.getMonth() + 1)
    .padStart(2, "0");

const dd =
  String(today.getDate())
    .padStart(2, "0");

dateInput.value =
  `${yyyy}-${mm}-${dd}`;


/*
--------------------------------------------------
YOUR MAUKSH PANCHANG API
--------------------------------------------------

If your current working API URL is different,
change ONLY this line.
*/

const PANCHANG_API =
  "https://mauksh-kundali-engine.onrender.com/api/panchang";


/*
--------------------------------------------------
LOAD PANCHANG
--------------------------------------------------
*/

async function loadPanchang() {

  const date =
    document.getElementById("date").value;

  const location =
    document.getElementById("location").value;

  const parts =
    location.split(",");

  const latitude =
    parts[0];

  const longitude =
    parts[1];

  const timezone =
    parts[2];


  const result =
    document.getElementById("result");


  result.innerHTML = `
    <div class="loading">
      Calculating Panchang...
    </div>
  `;


  try {

    const url =
      `${PANCHANG_API}?date=${encodeURIComponent(date)}&latitude=${encodeURIComponent(latitude)}&longitude=${encodeURIComponent(longitude)}&timezone=${encodeURIComponent(timezone)}`;


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Panchang API error"
      );

    }


    const data =
      await response.json();


    displayPanchang(data);


  } catch(error) {

    console.error(error);

    result.innerHTML = `

      <div class="loading">

        Unable to load Panchang.
        Please try again.

      </div>

    `;

  }

}


/*
--------------------------------------------------
DISPLAY PANCHANG
--------------------------------------------------
*/

function displayPanchang(data) {

  const result =
    document.getElementById("result");


  if (!data || data.success === false) {

    result.innerHTML = `

      <div class="loading">
        Panchang data unavailable.
      </div>

    `;

    return;

  }


  let html = `

    <h2 class="result-title">
      Panchang
    </h2>

  `;


  /*
  BASIC PANCHANG
  */

  html += `

    <div class="section">

      <h2>
        Panchang Details
      </h2>

      ${row("Vara", data.vara?.name)}
      ${row("Tithi", data.tithi?.name)}
      ${row("Paksha", data.paksha)}
      ${row("Nakshatra", data.nakshatra?.name)}
      ${row("Yoga", data.yoga?.name)}
      ${row("Karana", data.karana?.name)}
      ${row("Ritu", data.ritu)}
      ${row("Ayana", data.ayana)}

    </div>

  `;


  /*
  SUN
  */

  if (data.sun) {

    html += `

      <div class="section">

        <h2>
          Sun
        </h2>

        ${row("Sunrise", data.sun.rise)}
        ${row("Sunset", data.sun.set)}
        ${row("Sun Rashi", data.sun.rashi?.name)}

      </div>

    `;

  }


  /*
  MOON
  */

  if (data.moon) {

    html += `

      <div class="section">

        <h2>
          Moon
        </h2>

        ${row("Moonrise", data.moon.rise)}
        ${row("Moonset", data.moon.set)}
        ${row("Moon Rashi", data.moon.rashi?.name)}
        ${row("Nakshatra", data.moon.nakshatra?.name)}

      </div>

    `;

  }


  /*
  IMPORTANT TIMINGS
  */

  if (data.timings) {

    html += `

      <div class="section">

        <h2>
          Auspicious & Inauspicious Timings
        </h2>

        ${row("Abhijit", data.timings.abhijit)}
        ${row("Brahma Muhurta", data.timings.brahma)}
        ${row("Rahu Kaal", data.timings.rahuKaal)}
        ${row("Gulika", data.timings.gulika)}
        ${row("Yamaganda", data.timings.yamaganda)}

      </div>

    `;

  }


  /*
  CHOGHADIYA
  */

  if (
    data.choghadiya &&
    data.choghadiya.day
  ) {

    html += `

      <div class="section">

        <h2>
          Day Choghadiya
        </h2>

    `;


    data.choghadiya.day.forEach(item => {

      html += row(
        item.name,
        `${item.start} – ${item.end}`
      );

    });


    html += `

      </div>

    `;

  }


  result.innerHTML =
    html;

}


/*
--------------------------------------------------
ROW HELPER
--------------------------------------------------
*/

function row(label, value) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return "";

  }


  return `

    <div class="row">

      <span class="label">
        ${escapeHtml(label)}
      </span>

      <span class="value">
        ${escapeHtml(String(value))}
      </span>

    </div>

  `;

}


/*
--------------------------------------------------
ESCAPE HTML
--------------------------------------------------
*/

function escapeHtml(value) {

  return String(value).replace(
    /[&<>"']/g,
    function(char) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[char];

    }
  );

}


/*
--------------------------------------------------
LOAD TODAY AUTOMATICALLY
--------------------------------------------------
*/

loadPanchang();

</script>

</body>
</html>
