<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kaaldarpan | Vedic Panchang by Mauksh</title>

  <meta
    name="description"
    content="Kaaldarpan — Vedic Panchang and astrology tools by Mauksh."
  >

  <style>
    :root {
      --kaal-bg: #f8f5ef;
      --kaal-card: #fffdf9;
      --kaal-brown: #241b16;
      --kaal-text: #493e36;
      --kaal-muted: #75685e;
      --kaal-gold: #8b6f47;
      --kaal-border: #e5ddd1;
      --kaal-soft: #f4eee4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--kaal-bg);
      color: var(--kaal-text);
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: var(--kaal-brown);
      color: #f8f5ef;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;

      box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.12);
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 10px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 600;
    }

    .brand-subtitle {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.68;
      margin-top: 5px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 19px;
    }

    nav a {
      font-size: 14px;
      opacity: 0.9;
    }

    nav a:hover {
      opacity: 1;
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      color: #f8f5ef;
      font-size: 27px;
      cursor: pointer;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 950px;
      margin: auto;
      padding: 42px 16px 70px;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero-kicker {
      color: var(--kaal-gold);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 7px;
    }

    .hero h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 7vw, 50px);
      font-weight: 600;
      color: var(--kaal-brown);
      margin-bottom: 7px;
    }

    .hero p {
      color: var(--kaal-muted);
      font-size: 15px;
    }

    /* =========================
       DATE NAVIGATION
    ========================= */

    .date-card {
      background: var(--kaal-card);
      border: 1px solid var(--kaal-border);
      border-radius: 18px;
      padding: 17px;

      margin-bottom: 20px;

      box-shadow:
        0 6px 25px rgba(60, 45, 30, 0.045);
    }

    .date-navigation {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .date-arrow {
      border: 1px solid var(--kaal-border);
      background: var(--kaal-soft);
      color: var(--kaal-brown);

      border-radius: 11px;
      padding: 11px 14px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .date-arrow:hover {
      background: #eee5d8;
    }

    .date-arrow.next {
      justify-self: end;
    }

    .current-date {
      min-width: 190px;
      text-align: center;
    }

    .current-date-label {
      color: var(--kaal-gold);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 3px;
    }

    #selectedDate {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--kaal-brown);
    }

    /* =========================
       LOCATION
    ========================= */

    .location-card {
      background: var(--kaal-card);
      border: 1px solid var(--kaal-border);
      border-radius: 18px;

      padding: 19px;

      margin-bottom: 22px;
    }

    .location-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      color: var(--kaal-brown);
      margin-bottom: 13px;
    }

    .location-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--kaal-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 12px;

      border: 1px solid var(--kaal-border);
      border-radius: 10px;

      background: #fdfbf7;
      color: var(--kaal-text);

      font-size: 14px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--kaal-gold);
      box-shadow:
        0 0 0 3px rgba(139, 111, 71, 0.1);
    }

    .location-button {
      width: 100%;
      margin-top: 13px;

      border: 0;
      border-radius: 11px;

      background: var(--kaal-brown);
      color: #fffaf3;

      padding: 13px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .location-button:hover {
      opacity: 0.93;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      text-align: center;
      color: var(--kaal-muted);
      font-size: 14px;
      padding: 12px;
    }

    /* =========================
       PANCHANG GRID
    ========================= */

    .section-heading {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      font-weight: 600;

      color: var(--kaal-brown);

      margin:
        25px 0 13px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 15px;
    }

    .card {
      background: var(--kaal-card);
      border: 1px solid var(--kaal-border);
      border-radius: 17px;

      padding: 19px;

      box-shadow:
        0 5px 22px rgba(60, 45, 30, 0.035);
    }

    .card-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      color: var(--kaal-brown);

      margin-bottom: 11px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;

      padding: 8px 0;

      border-bottom: 1px solid #eee8df;

      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      color: var(--kaal-muted);
    }

    .info-value {
      text-align: right;
      font-weight: 600;
      color: var(--kaal-text);
    }

    /* =========================
       CHOGHADIYA
    ========================= */

    .choghadiya-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choghadiya-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 10px 12px;

      background: var(--kaal-soft);
      border-radius: 9px;

      font-size: 13px;
    }

    .choghadiya-name {
      font-weight: 600;
      color: var(--kaal-brown);
    }

    .choghadiya-time {
      color: var(--kaal-muted);
      text-align: right;
    }

    /* =========================
       TIMINGS
    ========================= */

    .timing-row {
      padding: 11px 0;
      border-bottom: 1px solid #eee8df;
    }

    .timing-row:last-child {
      border-bottom: 0;
    }

    .timing-name {
      font-size: 12px;
      color: var(--kaal-gold);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 600;
    }

    .timing-value {
      font-size: 15px;
      margin-top: 2px;
      color: var(--kaal-text);
      font-weight: 500;
    }

    /* =========================
       ERROR
    ========================= */

    .error {
      background: #fff4f0;
      border: 1px solid #ead5cc;
      color: #70473b;

      border-radius: 13px;
      padding: 15px;

      text-align: center;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: var(--kaal-brown);
      color: #f8f5ef;
      text-align: center;

      padding: 30px 18px;
    }

    .footer-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .footer-subtitle {
      font-size: 13px;
      opacity: 0.7;
    }

    .footer-link {
      display: inline-block;
      margin-top: 11px;
      font-size: 13px;
      opacity: 0.85;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      header {
        padding: 13px 15px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .brand-name {
        font-size: 18px;
      }

      nav {
        display: none;

        position: absolute;
        top: 68px;
        left: 0;
        right: 0;

        background: var(--kaal-brown);

        flex-direction: column;
        align-items: stretch;

        padding: 8px 20px 18px;
      }

      nav.open {
        display: flex;
      }

      nav a {
        padding: 12px 0;
        border-bottom:
          1px solid rgba(255,255,255,0.1);
      }

      .menu-button {
        display: block;
      }

      main {
        padding: 32px 13px 55px;
      }

      .date-navigation {
        grid-template-columns:
          44px 1fr 44px;
        gap: 7px;
      }

      .date-arrow {
        padding: 11px 8px;
        font-size: 0;
      }

      .date-arrow.prev::after {
        content: "‹";
        font-size: 25px;
      }

      .date-arrow.next::after {
        content: "›";
        font-size: 25px;
      }

      .current-date {
        min-width: 0;
      }

      #selectedDate {
        font-size: 18px;
      }

      .location-grid {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="header-inner">

      <a href="index.html" class="brand">

        <img
          src="assets/kaaldarpan-logo.png"
          alt="Kaaldarpan"
        >

        <div class="brand-text">

          <div class="brand-name">
            Kaaldarpan
          </div>

          <div class="brand-subtitle">
            by Mauksh
          </div>

        </div>

      </a>


      <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
      >
        ☰
      </button>


      <nav id="mainNav">

        <a href="index.html">
          Panchang
        </a>

        <a href="horoscope.html">
          Daily Horoscope
        </a>

        <a href="monthly-horoscope.html">
          Monthly Horoscope
        </a>

        <a href="yearly-horoscope.html">
          Yearly Horoscope
        </a>

        <a href="founder.html">
          Founder
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <section class="hero">

      <div class="hero-kicker">
        Vedic Astrology
      </div>

      <h1>
        Panchang
      </h1>

      <p>
        Daily Vedic Panchang powered by the Mauksh Panchang Engine.
      </p>

    </section>


    <!-- DATE -->

    <section class="date-card">

      <div class="date-navigation">

        <button
          class="date-arrow prev"
          id="previousDay"
          type="button"
        >
          Previous
        </button>


        <div class="current-date">

          <div class="current-date-label">
            Panchang for
          </div>

          <div id="selectedDate">
            Loading...
          </div>

        </div>


        <button
          class="date-arrow next"
          id="nextDay"
          type="button"
        >
          Next
        </button>

      </div>

    </section>


    <!-- LOCATION -->

    <section class="location-card">

      <div class="location-title">
        Location
      </div>

      <div class="location-grid">

        <div class="field">

          <label for="latitude">
            Latitude
          </label>

          <input
            id="latitude"
            type="number"
            step="any"
            value="30.0869"
          >

        </div>


        <div class="field">

          <label for="longitude">
            Longitude
          </label>

          <input
            id="longitude"
            type="number"
            step="any"
            value="78.2676"
          >

        </div>

      </div>


      <button
        class="location-button"
        id="updateLocation"
        type="button"
      >
        Update Panchang
      </button>

    </section>


    <div id="status">
      Loading today's Panchang...
    </div>


    <!-- PANCHANG CONTENT -->

    <div id="panchangContent"></div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <div class="footer-title">
      Kaaldarpan
    </div>

    <div class="footer-subtitle">
      An initiative by Mauksh
    </div>

    <a
      href="https://mauksh.com"
      target="_blank"
      rel="noopener"
      class="footer-link"
    >
      Visit Mauksh
    </a>

  </footer>


  <script>

    /* =========================================
       MAUKSH PANCHANG ENGINE
    ========================================= */

    const API_URL =
      "https://mauksh-kundali-engine.onrender.com/api/panchang";


    /* =========================================
       ELEMENTS
    ========================================= */

    const selectedDate =
      document.getElementById("selectedDate");

    const status =
      document.getElementById("status");

    const content =
      document.getElementById("panchangContent");

    const latitude =
      document.getElementById("latitude");

    const longitude =
      document.getElementById("longitude");


    /* =========================================
       DATE
    ========================================= */

    let currentDate =
      new Date();


    function formatDateForAPI(date) {

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          date.getDate()
        ).padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    function formatDisplayDate(date) {

      return date.toLocaleDateString(
        "en-IN",
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

    }


    function updateDateDisplay() {

      selectedDate.textContent =
        formatDisplayDate(
          currentDate
        );

    }


    /* =========================================
       LOAD PANCHANG
    ========================================= */

    async function loadPanchang() {

      const date =
        formatDateForAPI(
          currentDate
        );

      const lat =
        latitude.value.trim();

      const lon =
        longitude.value.trim();


      updateDateDisplay();


      status.textContent =
        "Loading Panchang...";

      content.innerHTML =
        "";


      try {

        const url =
          `${API_URL}?date=${encodeURIComponent(date)}` +
          `&latitude=${encodeURIComponent(lat)}` +
          `&longitude=${encodeURIComponent(lon)}` +
          `&timezone=Asia/Kolkata`;


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "API error: " +
            response.status
          );

        }


        const data =
          await response.json();


        if (
          data.success === false
        ) {

          throw new Error(
            "Panchang calculation failed."
          );

        }


        renderPanchang(data);


        status.textContent =
          "";

      }

      catch (error) {

        console.error(error);

        status.innerHTML = `
          <div class="error">
            Unable to load the Panchang right now.
            Please try again.
          </div>
        `;

      }

    }


    /* =========================================
       RENDER PANCHANG
    ========================================= */

    function renderPanchang(data) {

      let html = "";


      /* =========================
         BASIC PANCHANG
      ========================= */

      html += `
        <h2 class="section-heading">
          Today's Panchang
        </h2>

        <div class="grid">

          <div class="card">

            <div class="card-title">
              Tithi & Vara
            </div>

            ${row(
              "Vara",
              data.vara?.name
            )}

            ${row(
              "Tithi",
              data.tithi?.name
            )}

            ${row(
              "Tithi Ends",
              data.tithi?.ends
            )}

            ${row(
              "Paksha",
              data.tithi?.paksha ||
              data.paksha
            )}

          </div>


          <div class="card">

            <div class="card-title">
              Nakshatra & Yoga
            </div>

            ${row(
              "Nakshatra",
              data.nakshatra?.name
            )}

            ${row(
              "Pada",
              data.nakshatra?.pada ||
              data.moon?.nakshatra?.pada
            )}

            ${row(
              "Nakshatra Ends",
              data.nakshatra?.ends
            )}

            ${row(
              "Yoga",
              data.yoga?.name
            )}

            ${row(
              "Yoga Ends",
              data.yoga?.ends
            )}

          </div>


          <div class="card">

            <div class="card-title">
              Moon
            </div>

            ${row(
              "Rashi",
              data.moon?.rashi?.name
            )}

            ${row(
              "Nakshatra",
              data.moon?.nakshatra?.name
            )}

            ${row(
              "Moonrise",
              data.moon?.rise
            )}

            ${row(
              "Moonset",
              data.moon?.set
            )}

          </div>


          <div class="card">

            <div class="card-title">
              Sun
            </div>

            ${row(
              "Rashi",
              data.sun?.rashi?.name
            )}

            ${row(
              "Sunrise",
              data.sun?.rise
            )}

            ${row(
              "Sunset",
              data.sun?.set
            )}

            ${row(
              "Day Duration",
              data.dayDuration
            )}

          </div>


          <div class="card">

            <div class="card-title">
              Samvat
            </div>

            ${row(
              "Vikram Samvat",
              data.vikramSamvat
            )}

            ${row(
              "Shaka Samvat",
              data.shakaSamvat
            )}

            ${row(
              "Ritu",
              data.ritu
            )}

            ${row(
              "Ayana",
              data.ayana
            )}

          </div>


          <div class="card">

            <div class="card-title">
              Karana
            </div>

            ${row(
              "Karana",
              data.karana?.name
            )}

            ${row(
              "Ends",
              data.karana?.ends
            )}

            ${row(
              "Number",
              data.karana?.number
            )}

          </div>

        </div>
      `;


      /* =========================
         SUNRISE / SPECIAL TIMINGS
      ========================= */

      html += `
        <h2 class="section-heading">
          Auspicious & Inauspicious Timings
        </h2>

        <div class="grid">

          <div class="card">

            <div class="card-title">
              Daily Timings
            </div>

            ${timing(
              "Brahma Muhurta",
              data.timings?.brahma
            )}

            ${timing(
              "Abhijit Muhurta",
              data.timings?.abhijit
            )}

            ${timing(
              "Rahu Kaal",
              data.timings?.rahuKaal
            )}

            ${timing(
              "Gulika",
              data.timings?.gulika
            )}

            ${timing(
              "Yamaganda",
              data.timings?.yamaganda
            )}

          </div>


          <div class="card">

            <div class="card-title">
              Day Details
            </div>

            ${row(
              "Sunrise",
              data.sun?.rise
            )}

            ${row(
              "Sunset",
              data.sun?.set
            )}

            ${row(
              "Moonrise",
              data.moon?.rise
            )}

            ${row(
              "Moonset",
              data.moon?.set
            )}

            ${row(
              "Night Duration",
              data.nightDuration
            )}

          </div>

        </div>
      `;


      /* =========================
         CHOGHADIYA
      ========================= */

      if (
        data.choghadiya
      ) {

        html += `
          <h2 class="section-heading">
            Choghadiya
          </h2>

          <div class="grid">

            <div class="card">

              <div class="card-title">
                Day Choghadiya
              </div>

              <div class="choghadiya-list">

                ${
                  renderChoghadiya(
                    data.choghadiya.day
                  )
                }

              </div>

            </div>


            <div class="card">

              <div class="card-title">
                Night Choghadiya
              </div>

              <div class="choghadiya-list">

                ${
                  renderChoghadiya(
                    data.choghadiya.night
                  )
                }

              </div>

            </div>

          </div>
        `;

      }


      content.innerHTML =
        html;

    }


    /* =========================================
       ROW
    ========================================= */

    function row(label, value) {

      if (
        value === undefined ||
        value === null ||
        value === ""
      ) {

        return "";

      }


      return `
        <div class="info-row">

          <span class="info-label">
            ${escapeHTML(label)}
          </span>

          <span class="info-value">
            ${escapeHTML(value)}
          </span>

        </div>
      `;

    }


    /* =========================================
       TIMING
    ========================================= */

    function timing(label, value) {

      if (
        !value
      ) {

        return "";

      }


      return `
        <div class="timing-row">

          <div class="timing-name">
            ${escapeHTML(label)}
          </div>

          <div class="timing-value">
            ${escapeHTML(value)}
          </div>

        </div>
      `;

    }


    /* =========================================
       CHOGHADIYA
    ========================================= */

    function renderChoghadiya(items) {

      if (
        !Array.isArray(items)
      ) {

        return `
          <div class="info-row">
            <span class="info-label">
              No data available
            </span>
          </div>
        `;

      }


      return items
        .map(
          item => {

            return `
              <div class="choghadiya-row">

                <span class="choghadiya-name">
                  ${escapeHTML(
                    item.name || ""
                  )}
                </span>

                <span class="choghadiya-time">
                  ${escapeHTML(
                    item.start || ""
                  )}
                  –
                  ${escapeHTML(
                    item.end || ""
                  )}
                </span>

              </div>
            `;

          }
        )
        .join("");

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================
       DATE BUTTONS
    ========================================= */

    document
      .getElementById("previousDay")
      .addEventListener(
        "click",
        function () {

          currentDate.setDate(
            currentDate.getDate() - 1
          );

          loadPanchang();

        }
      );


    document
      .getElementById("nextDay")
      .addEventListener(
        "click",
        function () {

          currentDate.setDate(
            currentDate.getDate() + 1
          );

          loadPanchang();

        }
      );


    /* =========================================
       UPDATE LOCATION
    ========================================= */

    document
      .getElementById("updateLocation")
      .addEventListener(
        "click",
        function () {

          loadPanchang();

        }
      );


    /* =========================================
       MOBILE MENU
    ========================================= */

    const menuButton =
      document.getElementById(
        "menuButton"
      );

    const mainNav =
      document.getElementById(
        "mainNav"
      );


    menuButton.addEventListener(
      "click",
      function () {

        mainNav.classList.toggle(
          "open"
        );

      }
    );


    document
      .querySelectorAll(
        "#mainNav a"
      )
      .forEach(
        link => {

          link.addEventListener(
            "click",
            function () {

              mainNav.classList.remove(
                "open"
              );

            }
          );

        }
      );


    /* =========================================
       INITIAL LOAD
    ========================================= */

    loadPanchang();

  </script>

</body>
</html>
