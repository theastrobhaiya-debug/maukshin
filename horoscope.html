<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daily Horoscope | Kaaldarpan</title>

  <meta
    name="description"
    content="Daily Vedic horoscope by Kaaldarpan, powered by Mauksh."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f8f5ef;
      color: #241b16;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #241b16;
      color: #f8f5ef;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;

      box-shadow:
        0 2px 12px rgba(0,0,0,0.12);
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;

      object-fit: contain;

      border-radius: 10px;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;

      line-height: 1.15;
    }

    .brand-name {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 21px;
      font-weight: 600;

      letter-spacing: 0.2px;
    }

    .brand-subtitle {
      font-size: 10px;

      opacity: 0.65;

      margin-top: 4px;

      letter-spacing: 1px;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      align-items: center;

      gap: 20px;
    }

    nav a {
      font-size: 14px;
      opacity: 0.9;

      transition:
        opacity 0.2s ease,
        color 0.2s ease;
    }

    nav a:hover {
      opacity: 1;
      color: #d9bd8c;
    }

    .menu-button {
      display: none;

      background: none;
      border: none;

      color: #f8f5ef;

      font-size: 27px;

      cursor: pointer;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 900px;

      margin: auto;

      padding:
        48px 18px
        70px;
    }

    /* =========================
       PAGE HEADING
    ========================= */

    .page-heading {
      text-align: center;

      margin-bottom: 30px;
    }

    .small-title {
      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 2px;

      color: #8b6f47;

      font-weight: 600;

      margin-bottom: 8px;
    }

    .page-heading h1 {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(32px, 7vw, 48px);

      font-weight: 600;

      color: #241b16;

      margin-bottom: 9px;
    }

    .page-heading p {
      color: #75685e;

      font-size: 15px;
    }

    /* =========================
       DATE
    ========================= */

    .date-card {
      background: #fffdf9;

      border:
        1px solid #e5ddd1;

      border-radius: 18px;

      padding: 18px 20px;

      margin-bottom: 22px;

      text-align: center;

      box-shadow:
        0 5px 20px rgba(60,45,30,0.035);
    }

    .date-label {
      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 1.5px;

      color: #8b6f47;

      margin-bottom: 4px;

      font-weight: 600;
    }

    #horoscopeDate {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 20px;

      font-weight: 600;

      color: #241b16;
    }

    /* =========================
       ZODIAC SELECTOR
    ========================= */

    .selector-card {
      background: #fffdf9;

      border:
        1px solid #e5ddd1;

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 22px;

      box-shadow:
        0 5px 20px rgba(60,45,30,0.035);
    }

    .selector-label {
      display: block;

      font-size: 12px;

      font-weight: 600;

      color: #6f6258;

      margin-bottom: 9px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    #zodiacSelect {
      width: 100%;

      padding:
        14px 15px;

      border:
        1px solid #d8cfc2;

      border-radius: 12px;

      background: #fdfbf7;

      color: #241b16;

      font-size: 16px;

      font-family: inherit;

      outline: none;

      cursor: pointer;

      appearance: auto;
    }

    #zodiacSelect:focus {
      border-color: #8b6f47;

      box-shadow:
        0 0 0 3px
        rgba(139,111,71,0.12);
    }

    /* =========================
       STATUS
    ========================= */

    #horoscopeStatus {
      text-align: center;

      color: #806f61;

      font-size: 14px;

      margin:
        12px 0 18px;
    }

    /* =========================
       HOROSCOPE CARD
    ========================= */

    .horoscope-card {
      background: #fffdf9;

      border:
        1px solid #e5ddd1;

      border-radius: 20px;

      padding:
        30px 26px;

      box-shadow:
        0 8px 30px
        rgba(60,45,30,0.06);
    }

    .zodiac-title {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 30px;

      font-weight: 600;

      color: #241b16;

      margin-bottom: 25px;

      padding-bottom: 18px;

      border-bottom:
        1px solid #e6ddd2;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-bottom: 26px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 21px;

      font-weight: 600;

      color: #6f5432;

      margin-bottom: 7px;
    }

    .section p {
      color: #493e36;

      font-size: 15px;

      line-height: 1.85;
    }

    /* =========================
       MAUKSH TRUTH
    ========================= */

    .truth-box {
      margin-top: 30px;

      padding:
        19px 20px;

      background: #f4eee4;

      border-left:
        4px solid #8b6f47;

      border-radius: 10px;
    }

    .truth-box .section-title {
      margin-bottom: 6px;
    }

    .truth-box p {
      font-weight: 500;

      color: #493c31;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #241b16;

      color: #f8f5ef;

      text-align: center;

      padding:
        30px 18px;
    }

    .footer-brand {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 19px;

      margin-bottom: 5px;
    }

    .footer-by {
      font-size: 13px;

      opacity: 0.65;
    }

    .footer-link {
      display: inline-block;

      margin-top: 12px;

      font-size: 13px;

      opacity: 0.85;
    }

    .footer-link:hover {
      opacity: 1;

      color: #d9bd8c;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      header {
        padding:
          12px 16px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .brand-name {
        font-size: 19px;
      }

      .brand-subtitle {
        font-size: 9px;
      }

      .menu-button {
        display: block;
      }

      nav {
        display: none;

        position: absolute;

        top: 67px;

        left: 0;
        right: 0;

        background: #241b16;

        flex-direction: column;

        align-items: stretch;

        padding:
          10px 20px
          18px;

        gap: 0;

        box-shadow:
          0 8px 20px
          rgba(0,0,0,0.16);
      }

      nav.open {
        display: flex;
      }

      nav a {
        padding:
          13px 0;

        border-bottom:
          1px solid
          rgba(255,255,255,0.09);
      }

      nav a:last-child {
        border-bottom: none;
      }

      main {
        padding:
          36px 14px
          55px;
      }

      .page-heading {
        margin-bottom: 25px;
      }

      .page-heading h1 {
        font-size: 36px;
      }

      .date-card,
      .selector-card {
        border-radius: 16px;
      }

      .horoscope-card {
        padding:
          24px 18px;

        border-radius: 17px;
      }

      .zodiac-title {
        font-size: 27px;

        margin-bottom: 23px;
      }

      .section-title {
        font-size: 20px;
      }

      .section p {
        font-size: 15px;

        line-height: 1.8;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="header-inner">

      <a
        href="index.html"
        class="brand"
      >

        <img
          src="assets/kaaldarpan-logo.png"
          alt="Kaaldarpan"
        >

        <div class="brand-text">

          <div class="brand-name">
            Kaaldarpan
          </div>

          <div class="brand-subtitle">
            Vedic Astrology
          </div>

        </div>

      </a>


      <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
        aria-expanded="false"
      >
        ☰
      </button>


      <nav id="mainNav">

        <a href="index.html">
          Panchang
        </a>

        <a href="horoscope.html">
          Daily Horoscope
        </a>

        <a href="founder.html">
          Founder
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <section class="page-heading">

      <div class="small-title">
        Vedic Astrology
      </div>

      <h1>
        Daily Horoscope
      </h1>

      <p>
        Your daily Vedic guidance, powered by Mauksh.
      </p>

    </section>


    <!-- DATE -->

    <section class="date-card">

      <div class="date-label">
        Horoscope for
      </div>

      <div id="horoscopeDate">
        Loading...
      </div>

    </section>


    <!-- ZODIAC -->

    <section class="selector-card">

      <label
        class="selector-label"
        for="zodiacSelect"
      >
        Select your zodiac sign
      </label>

      <select id="zodiacSelect">

        <option value="aries">
          ♈ Aries
        </option>

        <option value="taurus">
          ♉ Taurus
        </option>

        <option value="gemini">
          ♊ Gemini
        </option>

        <option value="cancer">
          ♋ Cancer
        </option>

        <option value="leo">
          ♌ Leo
        </option>

        <option value="virgo">
          ♍ Virgo
        </option>

        <option value="libra">
          ♎ Libra
        </option>

        <option value="scorpio">
          ♏ Scorpio
        </option>

        <option value="sagittarius">
          ♐ Sagittarius
        </option>

        <option value="capricorn">
          ♑ Capricorn
        </option>

        <option value="aquarius">
          ♒ Aquarius
        </option>

        <option value="pisces">
          ♓ Pisces
        </option>

      </select>

    </section>


    <!-- STATUS -->

    <div id="horoscopeStatus">
      Loading today's horoscope...
    </div>


    <!-- HOROSCOPE -->

    <article
      class="horoscope-card"
      id="horoscopeContent"
    >
    </article>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <div class="footer-brand">
      Kaaldarpan
    </div>

    <div class="footer-by">
      An initiative by Mauksh
    </div>

    <a
      href="https://mauksh.com"
      class="footer-link"
      target="_blank"
      rel="noopener"
    >
      Visit Mauksh
    </a>

  </footer>


  <script>

    /* ==========================================
       HOROSCOPE DATA
       ========================================== */

    const HOROSCOPE_URL =
      "https://raw.githubusercontent.com/theastrobhaiya-debug/Mauksh-data/main/Horoscope.json";


    const zodiacSelect =
      document.getElementById(
        "zodiacSelect"
      );

    const horoscopeContent =
      document.getElementById(
        "horoscopeContent"
      );

    const horoscopeStatus =
      document.getElementById(
        "horoscopeStatus"
      );

    const horoscopeDate =
      document.getElementById(
        "horoscopeDate"
      );


    /* ==========================================
       LOAD DATA
       ========================================== */

    async function loadHoroscope() {

      try {

        horoscopeStatus.textContent =
          "Loading today's horoscope...";


        const response =
          await fetch(
            HOROSCOPE_URL +
            "?v=" +
            Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        window.horoscopeData =
          data;


        /* DATE */

        if (data.date) {

          horoscopeDate.textContent =
            formatDate(data.date);

        } else {

          horoscopeDate.textContent =
            "Today";

        }


        horoscopeStatus.textContent =
          "";


        showHoroscope(
          zodiacSelect.value
        );

      }

      catch (error) {

        console.error(
          "Horoscope error:",
          error
        );


        horoscopeStatus.textContent =
          "Daily horoscope is temporarily unavailable.";


        horoscopeContent.innerHTML = `

          <div class="section">

            <div class="section-title">
              Please try again
            </div>

            <p>
              We couldn't load today's horoscope.
              Please refresh the page in a moment.
            </p>

          </div>

        `;

      }

    }


    /* ==========================================
       FORMAT DATE
       ========================================== */

    function formatDate(value) {

      if (!value) {
        return "Today";
      }


      /*
        If API returns:
        2026-08-30
      */

      const isoMatch =
        String(value).match(
          /^(\d{4})-(\d{2})-(\d{2})$/
        );


      if (isoMatch) {

        const date =
          new Date(
            Number(isoMatch[1]),
            Number(isoMatch[2]) - 1,
            Number(isoMatch[3])
          );


        return date.toLocaleDateString(
          "en-IN",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      }


      return value;

    }


    /* ==========================================
       SHOW HOROSCOPE
       ========================================== */

    function showHoroscope(sign) {

      if (
        !window.horoscopeData ||
        !window.horoscopeData[sign]
      ) {

        horoscopeContent.innerHTML = `

          <div class="section">

            <div class="section-title">
              Horoscope unavailable
            </div>

            <p>
              No horoscope was found for this
              zodiac sign.
            </p>

          </div>

        `;

        return;
      }


      const rawHTML =
        window.horoscopeData[sign];


      const parser =
        new DOMParser();


      const doc =
        parser.parseFromString(
          rawHTML,
          "text/html"
        );


      /* ZODIAC HEADING */

      const heading =
        doc.querySelector("h3");


      const paragraphs =
        Array.from(
          doc.querySelectorAll("p")
        );


      const zodiacTitle =
        heading
          ? heading.textContent.trim()
          : getZodiacName(sign);


      let html = `

        <div class="zodiac-title">
          ${escapeHTML(zodiacTitle)}
        </div>

      `;


      paragraphs.forEach(
        paragraph => {

          const text =
            paragraph.textContent.trim();


          if (!text) {
            return;
          }


          const section =
            detectSection(text);


          if (
            section.type === "truth"
          ) {

            html += `

              <div class="truth-box">

                <div class="section-title">
                  ⚡ Mauksh Truth
                </div>

                <p>
                  ${escapeHTML(section.text)}
                </p>

              </div>

            `;

          }

          else {

            html += `

              <div class="section">

                <div class="section-title">
                  ${escapeHTML(section.title)}
                </div>

                <p>
                  ${escapeHTML(section.text)}
                </p>

              </div>

            `;

          }

        }
      );


      horoscopeContent.innerHTML =
        html;

    }


    /* ==========================================
       SECTION DETECTION
       ========================================== */

    function detectSection(text) {

      const cleanText =
        text.trim();


      if (
        cleanText.startsWith(
          "🔥 Energy:"
        )
      ) {

        return {

          type: "normal",

          title: "🔥 Energy",

          text:
            cleanText
              .replace(
                /^🔥\s*Energy:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.startsWith(
          "💼 Career:"
        )
      ) {

        return {

          type: "normal",

          title: "💼 Career",

          text:
            cleanText
              .replace(
                /^💼\s*Career:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.startsWith(
          "❤️ Love:"
        )
      ) {

        return {

          type: "normal",

          title: "❤️ Love",

          text:
            cleanText
              .replace(
                /^❤️\s*Love:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.startsWith(
          "💰 Money:"
        )
      ) {

        return {

          type: "normal",

          title: "💰 Money",

          text:
            cleanText
              .replace(
                /^💰\s*Money:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.startsWith(
          "🧘 Advice:"
        )
      ) {

        return {

          type: "normal",

          title: "🧘 Advice",

          text:
            cleanText
              .replace(
                /^🧘\s*Advice:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.includes(
          "Mauksh Truth:"
        )
      ) {

        return {

          type: "truth",

          title: "⚡ Mauksh Truth",

          text:
            cleanText
              .replace(
                /^⚡\s*Mauksh Truth:\s*/i,
                ""
              )
              .trim()

        };

      }


      return {

        type: "normal",

        title: "Daily Guidance",

        text: cleanText

      };

    }


    /* ==========================================
       ZODIAC NAMES
       ========================================== */

    function getZodiacName(sign) {

      const names = {

        aries: "♈ Aries",

        taurus: "♉ Taurus",

        gemini: "♊ Gemini",

        cancer: "♋ Cancer",

        leo: "♌ Leo",

        virgo: "♍ Virgo",

        libra: "♎ Libra",

        scorpio: "♏ Scorpio",

        sagittarius: "♐ Sagittarius",

        capricorn: "♑ Capricorn",

        aquarius: "♒ Aquarius",

        pisces: "♓ Pisces"

      };


      return names[sign] || sign;

    }


    /* ==========================================
       ESCAPE HTML
       ========================================== */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ==========================================
       ZODIAC CHANGE
       ========================================== */

    zodiacSelect.addEventListener(
      "change",
      function () {

        showHoroscope(
          this.value
        );


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );


    /* ==========================================
       MOBILE MENU
       ========================================== */

    const menuButton =
      document.getElementById(
        "menuButton"
      );


    const mainNav =
      document.getElementById(
        "mainNav"
      );


    menuButton.addEventListener(
      "click",
      function () {

        const isOpen =
          mainNav.classList.toggle(
            "open"
          );


        this.setAttribute(
          "aria-expanded",
          isOpen
        );

      }
    );


    /* CLOSE MENU AFTER LINK */

    document
      .querySelectorAll(
        "#mainNav a"
      )
      .forEach(
        link => {

          link.addEventListener(
            "click",
            function () {

              mainNav.classList.remove(
                "open"
              );

              menuButton.setAttribute(
                "aria-expanded",
                "false"
              );

            }
          );

        }
      );


    /* ==========================================
       START
       ========================================== */

    loadHoroscope();

  </script>

</body>
</html>
