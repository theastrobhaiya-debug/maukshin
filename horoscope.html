<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Horoscope | Kaaldarpan</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fffaf2;
  color: #3b2414;
  font-family: Georgia, "Times New Roman", serif;
}

header {
  text-align: center;
  padding: 25px 15px 20px;
  background: #fff4dc;
  border-bottom: 1px solid #e3c58d;
}

.logo {
  width: 75px;
  height: 75px;
  object-fit: contain;
}

.brand {
  margin: 8px 0 2px;
  color: #a85b08;
  font-size: 29px;
}

.by {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 1.4px;
  color: #765536;
  text-transform: uppercase;
}

nav {
  text-align: center;
  padding: 13px;
  background: white;
  border-bottom: 1px solid #ead9ba;
}

nav a {
  margin: 0 8px;
  text-decoration: none;
  color: #77430b;
  font-family: Arial, sans-serif;
  font-size: 13px;
}

.hero {
  text-align: center;
  padding: 35px 15px 25px;
}

.om {
  font-size: 28px;
  color: #c87508;
}

h1 {
  margin: 8px 0;
  font-size: 34px;
  color: #6f3907;
}

.subtitle {
  max-width: 650px;
  margin: auto;
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: #765f48;
}

.date {
  display: inline-block;
  margin-top: 18px;
  padding: 9px 15px;
  background: white;
  border: 1px solid #dfc18a;
  border-radius: 10px;
  font-family: Arial, sans-serif;
  font-size: 13px;
}

.status {
  margin-top: 8px;
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: #8a765f;
}

.container {
  width: min(94%, 950px);
  margin: auto;
  padding-bottom: 45px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.card {
  background: white;
  border: 1px solid #ead7b5;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 3px 12px rgba(100,70,30,.06);
}

.card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.symbol {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #fff3d8;
  border: 1px solid #e4c58b;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;
}

.sign {
  margin: 0;
  color: #7a4107;
  font-size: 20px;
}

.sanskrit {
  margin-top: 3px;
  color: #9b7952;
  font-family: Arial, sans-serif;
  font-size: 11px;
}

.text {
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.75;
  color: #4d3927;
}

.loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px;
  font-family: Arial, sans-serif;
  color: #806d58;
}

footer {
  text-align: center;
  padding: 25px;
  background: #f6e6c8;
  border-top: 1px solid #dfc18a;
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: #765536;
}

footer strong {
  color: #9b5307;
}

@media (max-width: 650px) {

  .grid {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 29px;
  }

}
</style>
</head>


<body>

<header>

  <img
    src="assets/kaaldarpan-logo.png"
    class="logo"
    alt="Kaaldarpan"
  >

  <h2 class="brand">
    Kaaldarpan
  </h2>

  <div class="by">
    An initiative by Mauksh
  </div>

</header>


<nav>

  <a href="index.html">
    Panchang
  </a>

  <a href="horoscope.html">
    Daily Horoscope
  </a>

</nav>


<section class="hero">

  <div class="om">ॐ</div>

  <h1>
    Daily Horoscope
  </h1>

  <p class="subtitle">
    Your daily Vedic astrology guidance for all twelve zodiac signs.
  </p>

  <div class="date" id="date"></div>

  <div class="status" id="status">
    Loading horoscope...
  </div>

</section>


<main class="container">

  <div class="grid" id="grid">

    <div class="loading">
      Loading today's horoscope...
    </div>

  </div>

</main>


<footer>

  <strong>Kaaldarpan</strong>

  <br>

  An initiative by Mauksh

</footer>


<script>

const DATA_URL =
"https://raw.githubusercontent.com/theastrobhaiya-debug/Mauksh-data/main/Horoscope.json";


const signs = [

  ["Aries", "Mesha", "♈"],
  ["Taurus", "Vrishabha", "♉"],
  ["Gemini", "Mithuna", "♊"],
  ["Cancer", "Karka", "♋"],
  ["Leo", "Simha", "♌"],
  ["Virgo", "Kanya", "♍"],
  ["Libra", "Tula", "♎"],
  ["Scorpio", "Vrishchika", "♏"],
  ["Sagittarius", "Dhanu", "♐"],
  ["Capricorn", "Makara", "♑"],
  ["Aquarius", "Kumbha", "♒"],
  ["Pisces", "Meena", "♓"]

];


document.getElementById("date").textContent =
new Date().toLocaleDateString(
  "en-IN",
  {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  }
);


/* Remove HTML tags from horoscope text */

function cleanText(value) {

  if (!value) {
    return "";
  }

  let text = String(value);

  text = text.replace(/<[^>]*>/g, "");

  text = text
    .replace(/&nbsp;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&quot;/gi, '"')
    .replace(/&#39;/gi, "'")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">");

  return text
    .replace(/\s+/g, " ")
    .trim();

}


/* Find zodiac prediction */

function findPrediction(data, sign) {

  const source =
    data.horoscope ||
    data.predictions ||
    data.signs ||
    data.zodiac ||
    data;

  if (!source || typeof source !== "object") {
    return "";
  }

  const key = Object.keys(source).find(function(k) {

    return k
      .toLowerCase()
      .replace(/[^a-z]/g, "") ===
      sign.toLowerCase();

  });

  if (!key) {
    return "";
  }

  const value = source[key];

  if (typeof value === "string") {
    return cleanText(value);
  }

  if (typeof value === "object" && value !== null) {

    return cleanText(
      value.prediction ||
      value.horoscope ||
      value.text ||
      value.content ||
      ""
    );

  }

  return "";

}


/* Render cards */

function render(data) {

  const grid =
    document.getElementById("grid");

  grid.innerHTML = signs.map(function(item) {

    const name = item[0];
    const sanskrit = item[1];
    const symbol = item[2];

    const prediction =
      findPrediction(data, name);

    return `

      <article class="card">

        <div class="card-head">

          <div class="symbol">
            ${symbol}
          </div>

          <div>

            <h2 class="sign">
              ${name}
            </h2>

            <div class="sanskrit">
              ${sanskrit}
            </div>

          </div>

        </div>

        <div class="text">
          ${prediction || "Today's horoscope is being updated."}
        </div>

      </article>

    `;

  }).join("");

  document.getElementById("status").textContent =
    "Updated from Mauksh daily horoscope data";

}


/* Load Mauksh JSON */

fetch(
  DATA_URL + "?v=" + Date.now(),
  {
    cache: "no-store"
  }
)

.then(function(response) {

  if (!response.ok) {
    throw new Error("JSON failed");
  }

  return response.json();

})

.then(function(data) {

  console.log("Mauksh Horoscope:", data);

  render(data);

})

.catch(function(error) {

  console.error(error);

  document.getElementById("status").textContent =
    "Unable to load today's horoscope.";

});

</script>

</body>
</html>
