<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Daily Horoscope | Kaaldarpan by Mauksh</title>

  <meta
    name="description"
    content="Daily Vedic horoscope by Kaaldarpan, powered by Mauksh."
  >

  <style>

    /* ================================
       GLOBAL
    ================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(
          circle at top,
          #241936 0%,
          #100c18 45%,
          #09070d 100%
        );
      color: #f5f1e8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
    }

    /* ================================
       HEADER
    ================================= */

    .site-header {
      width: 100%;
      background: rgba(12, 9, 18, 0.96);
      border-bottom: 1px solid rgba(221, 183, 91, 0.20);
      padding: 15px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: sticky;
      top: 0;
      z-index: 1000;

      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      color: #e5c477;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .brand-by {
      color: #a9a3ad;
      font-size: 12px;
      margin-top: 4px;
    }

    /* ================================
       NAVIGATION
    ================================= */

    .main-nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .main-nav a {
      color: #ddd7df;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .main-nav a:hover {
      color: #e5c477;
    }

    .main-nav a.active {
      color: #e5c477;
    }

    /* ================================
       PAGE
    ================================= */

    .page {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 20px 80px;
    }

    /* ================================
       HERO
    ================================= */

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero-kicker {
      color: #c6a85e;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .hero h1 {
      margin: 0;
      color: #f3d58c;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .hero-subtitle {
      color: #aaa2ad;
      margin-top: 10px;
      font-size: 15px;
    }

    /* ================================
       DATE
    ================================= */

    .date-card {
      text-align: center;
      margin: 25px auto 30px;
      color: #c8c1ca;
      font-size: 14px;
    }

    .date-card strong {
      color: #e5c477;
      font-weight: 500;
    }

    /* ================================
       ZODIAC SELECTOR
    ================================= */

    .selector-wrapper {
      max-width: 500px;
      margin: 0 auto 35px;
    }

    .selector-label {
      display: block;
      color: #cfc7d2;
      font-size: 13px;
      margin-bottom: 8px;
    }

    #zodiacSelect {
      width: 100%;
      padding: 14px 16px;

      border: 1px solid rgba(229, 196, 119, 0.35);
      border-radius: 12px;

      background: #17111f;
      color: #f4ead4;

      font-size: 15px;
      outline: none;

      cursor: pointer;
    }

    #zodiacSelect:focus {
      border-color: #e5c477;
    }

    /* ================================
       HOROSCOPE CARD
    ================================= */

    .horoscope-card {
      background:
        linear-gradient(
          145deg,
          rgba(35, 26, 48, 0.95),
          rgba(18, 13, 25, 0.98)
        );

      border: 1px solid rgba(229, 196, 119, 0.18);
      border-radius: 20px;

      padding: 32px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.30);
    }

    /* ================================
       ZODIAC TITLE
    ================================= */

    .horoscope-card h3 {
      display: none;
    }

    /* ================================
       CONTENT
    ================================= */

    .horoscope-card p {
      margin: 0 0 24px;
      color: #d8d1da;
      font-size: 15px;
      line-height: 1.8;
    }

    /* ================================
       SECTION DETECTION
    ================================= */

    .horoscope-card p strong {
      color: #e5c477;
    }

    /* ================================
       MESSAGES WITH EMOJI
    ================================= */

    .horoscope-card p:first-of-type {
      color: #ddd5df;
    }

    /* ================================
       MAUKSH TRUTH
    ================================= */

    .horoscope-card p.truth {
      margin-top: 32px;
      margin-bottom: 0;

      padding: 20px 22px;

      border-left: 3px solid #e5c477;

      background: rgba(229, 196, 119, 0.06);

      border-radius: 0 12px 12px 0;

      color: #f0d99d;
      font-size: 15px;
    }

    /* ================================
       LOADING
    ================================= */

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #aaa2ad;
    }

    .error {
      text-align: center;
      padding: 40px 20px;
      color: #d9a5a5;

      background: rgba(120, 40, 40, 0.12);
      border: 1px solid rgba(180, 90, 90, 0.20);
      border-radius: 14px;
    }

    /* ================================
       FOOTER
    ================================= */

    .footer {
      text-align: center;
      padding: 35px 20px 50px;

      color: #827b87;
      font-size: 12px;
    }

    .footer-brand {
      color: #c6a85e;
      margin-bottom: 6px;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 750px) {

      .site-header {
        padding: 13px 15px;
      }

      .main-nav {
        gap: 10px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .logo {
        width: 40px;
        height: 40px;
      }

      .brand-name {
        font-size: 18px;
      }

      .brand-by {
        font-size: 10px;
      }

      .page {
        padding: 35px 15px 60px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .horoscope-card {
        padding: 23px 20px;
        border-radius: 16px;
      }

      .horoscope-card p {
        font-size: 14px;
        line-height: 1.75;
      }
    }

    @media (max-width: 520px) {

      .site-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 13px;
      }

      .main-nav {
        width: 100%;
        justify-content: space-between;
        gap: 5px;
      }

      .main-nav a {
        font-size: 11px;
      }

      .hero h1 {
        font-size: 29px;
      }
    }

  </style>
</head>


<body>

  <!-- =====================================
       HEADER
  ====================================== -->

  <header class="site-header">

    <a href="/" class="brand">

      <!--
        CHANGE THIS PATH ONLY IF YOUR LOGO
        IS STORED SOMEWHERE ELSE.
      -->
      <img
        src="/images/kaaldarpan.png"
        alt="Kaaldarpan"
        class="logo"
      >

      <div class="brand-text">

        <div class="brand-name">
          Kaaldarpan
        </div>

        <div class="brand-by">
          by Mauksh
        </div>

      </div>

    </a>


    <nav class="main-nav">

      <a href="/">
        Panchang
      </a>

      <a href="/daily.html" class="active">

      </a>

      <a href="/monthly.html">

      </a>

      <a href="/yearly.html">

      </a>

      <a href="/founder.html">

      </a>

    </nav>

  </header>


  <!-- =====================================
       MAIN PAGE
  ====================================== -->

  <main class="page">


    <!-- HERO -->

    <section class="hero">

      <div class="hero-kicker">
        Vedic Astrology
      </div>

      <h1>
        Daily Horoscope
      </h1>

      <div class="hero-subtitle">
        Your cosmic guidance for today
      </div>

    </section>


    <!-- DATE -->

    <div
      id="dateDisplay"
      class="date-card"
    >
      Loading date...
    </div>


    <!-- ZODIAC SELECTOR -->

    <div class="selector-wrapper">

      <label
        for="zodiacSelect"
        class="selector-label"
      >
        Select your zodiac sign
      </label>

      <select id="zodiacSelect">

        <option value="aries">
          ♈ Aries
        </option>

        <option value="taurus">
          ♉ Taurus
        </option>

        <option value="gemini">
          ♊ Gemini
        </option>

        <option value="cancer">
          ♋ Cancer
        </option>

        <option value="leo">

        </option>

        <option value="virgo">
          ♍ Virgo
        </option>

        <option value="libra">
          ♎ Libra
        </option>

        <option value="scorpio">
          ♏ Scorpio
        </option>

        <option value="sagittarius">
          ♐ Sagittarius
        </option>

        <option value="capricorn">
          ♑ Capricorn
        </option>

        <option value="aquarius">
          ♒ Aquarius
        </option>

        <option value="pisces">
          ♓ Pisces
        </option>

      </select>

    </div>


    <!-- HOROSCOPE -->

    <article
      id="horoscope"
      class="horoscope-card"
    >

      <div class="loading">
        Loading your horoscope...
      </div>

    </article>


  </main>


  <!-- =====================================
       FOOTER
  ====================================== -->

  <footer class="footer">

    <div class="footer-brand">
      Kaaldarpan by Mauksh
    </div>

    <div>
      Vedic astrology tools powered by Mauksh
    </div>

  </footer>


  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script>

    /*
      ======================================
      YOUR JSON FILE
      ======================================

      If your file is somewhere else,
      change ONLY this line.
    */

    const DATA_URL = "/mauksh-data/Horoscope.json";


    /*
      ======================================
      ELEMENTS
      ======================================
    */

    const zodiacSelect =
      document.getElementById("zodiacSelect");

    const horoscope =
      document.getElementById("horoscope");

    const dateDisplay =
      document.getElementById("dateDisplay");


    /*
      ======================================
      LOAD HOROSCOPE DATA
      ======================================
    */

    let horoscopeData = null;


    async function loadHoroscope() {

      try {

        const response =
          await fetch(DATA_URL, {
            cache: "no-store"
          });


        if (!response.ok) {

          throw new Error(
            "Could not load Horoscope.json"
          );

        }


        horoscopeData =
          await response.json();


        /*
          Show date
        */

        if (horoscopeData.date) {

          dateDisplay.innerHTML =
            "For <strong>" +
            escapeHTML(horoscopeData.date) +
            "</strong>";

        }


        /*
          Show default zodiac
        */

        showZodiac(
          zodiacSelect.value
        );


      } catch (error) {

        console.error(error);

        horoscope.innerHTML = `
          <div class="error">
            <strong>Horoscope is temporarily unavailable.</strong>
            <br><br>
            Please check that Horoscope.json is available at:
            <br>
            ${DATA_URL}
          </div>
        `;

      }

    }


    /*
      ======================================
      SHOW SELECTED ZODIAC
      ======================================
    */

    function showZodiac(sign) {

      if (!horoscopeData) {
        return;
      }


      const content =
        horoscopeData[sign];


      if (!content) {

        horoscope.innerHTML = `
          <div class="error">
            Horoscope data not available
            for this zodiac sign.
          </div>
        `;

        return;

      }


      /*
        IMPORTANT:

        Your JSON already contains HTML such as:

        <h3>♈ Aries</h3>
        <p>...</p>

        We intentionally use innerHTML here
        so those tags render correctly rather
        than appearing as text.
      */

      horoscope.innerHTML = content;


      /*
        Convert the existing horoscope paragraphs
        into cleaner section blocks.
      */

      formatSections();

    }


    /*
      ======================================
      FORMAT SECTIONS
      ======================================
    */

    function formatSections() {

      const paragraphs =
        horoscope.querySelectorAll("p");


      paragraphs.forEach((paragraph) => {

        const text =
          paragraph.textContent.trim();


        /*
          Career
        */

        if (text.startsWith("💼 Career:")) {

          paragraph.classList.add(
            "section-career"
          );

        }


        /*
          Love
        */

        if (text.startsWith("❤️ Love:")) {

          paragraph.classList.add(
            "section-love"
          );

        }


        /*
          Money
        */

        if (text.startsWith("💰 Money:")) {

          paragraph.classList.add(
            "section-money"
          );

        }


        /*
          Advice
        */

        if (text.startsWith("🧘 Advice:")) {

          paragraph.classList.add(
            "section-advice"
          );

        }


        /*
          Mauksh Truth
        */

        if (text.startsWith("⚡ Mauksh Truth:")) {

          paragraph.classList.add(
            "truth"
          );

        }

      });

    }


    /*
      ======================================
      ESCAPE HTML
      ======================================
    */

    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value;

      return div.innerHTML;

    }


    /*
      ======================================
      DROPDOWN CHANGE
      ======================================
    */

    zodiacSelect.addEventListener(
      "change",
      function () {

        showZodiac(
          this.value
        );

        /*
          Scroll gently back to horoscope
        */

        setTimeout(() => {

          horoscope.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        }, 50);

      }
    );


    /*
      ======================================
      START
      ======================================
    */

    loadHoroscope();

  </script>

</body>
</html>
