<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Daily Horoscope | Kaaldarpan by Mauksh</title>

  <meta
    name="description"
    content="Daily Vedic horoscope by Kaaldarpan, powered by Mauksh."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f8f5ef;
      color: #241b16;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #241b16;
      color: #f8f5ef;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 10px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .brand-subtitle {
      font-size: 11px;
      opacity: 0.72;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    nav a {
      font-size: 14px;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 1;
    }

    .menu-button {
      display: none;
      background: none;
      border: none;
      color: #f8f5ef;
      font-size: 27px;
      cursor: pointer;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 900px;
      margin: auto;
      padding: 45px 18px 70px;
    }

    .page-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .page-heading .small-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #8b6f47;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .page-heading h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 600;
      color: #241b16;
      margin-bottom: 8px;
    }

    .page-heading p {
      color: #75685e;
      font-size: 15px;
    }

    /* =========================
       DATE CARD
    ========================= */

    .date-card {
      background: #fffdf9;
      border: 1px solid #e5ddd1;
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 22px;
      text-align: center;
    }

    .date-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8b6f47;
      margin-bottom: 4px;
    }

    #horoscopeDate {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 600;
    }

    /* =========================
       ZODIAC SELECTOR
    ========================= */

    .selector-card {
      background: #fffdf9;
      border: 1px solid #e5ddd1;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .selector-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #5e5148;
      margin-bottom: 9px;
    }

    #zodiacSelect {
      width: 100%;
      padding: 14px 15px;

      border: 1px solid #d8cfc2;
      border-radius: 12px;

      background: #fdfbf7;
      color: #241b16;

      font-size: 16px;
      outline: none;
      cursor: pointer;
    }

    #zodiacSelect:focus {
      border-color: #8b6f47;
      box-shadow: 0 0 0 3px rgba(139,111,71,0.12);
    }

    /* =========================
       LOADING
    ========================= */

    #horoscopeStatus {
      text-align: center;
      color: #806f61;
      font-size: 14px;
      margin: 15px 0;
    }

    /* =========================
       HOROSCOPE
    ========================= */

    .horoscope-card {
      background: #fffdf9;
      border: 1px solid #e5ddd1;
      border-radius: 20px;
      padding: 28px 25px;

      box-shadow:
        0 8px 30px rgba(60,45,30,0.06);
    }

    .zodiac-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 600;
      color: #241b16;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid #e6ddd2;
    }

    .section {
      margin-bottom: 25px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 600;
      color: #6f5432;
      margin-bottom: 7px;
    }

    .section p {
      color: #493e36;
      font-size: 15px;
      line-height: 1.8;
    }

    .truth-box {
      margin-top: 30px;
      padding: 19px 20px;

      background: #f4eee4;
      border-left: 4px solid #8b6f47;
      border-radius: 10px;
    }

    .truth-box .section-title {
      margin-bottom: 6px;
    }

    .truth-box p {
      font-weight: 500;
      color: #493c31;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #241b16;
      color: #f8f5ef;
      text-align: center;
      padding: 30px 18px;
    }

    .footer-brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      margin-bottom: 5px;
    }

    .footer-by {
      font-size: 13px;
      opacity: 0.7;
    }

    .footer-link {
      display: inline-block;
      margin-top: 12px;
      font-size: 13px;
      opacity: 0.85;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      header {
        padding: 13px 16px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .brand-name {
        font-size: 18px;
      }

      nav {
        display: none;
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;

        background: #241b16;

        flex-direction: column;
        align-items: stretch;

        padding: 15px 20px 20px;
        gap: 0;
      }

      nav.open {
        display: flex;
      }

      nav a {
        padding: 12px 0;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }

      .menu-button {
        display: block;
      }

      main {
        padding: 35px 14px 55px;
      }

      .horoscope-card {
        padding: 23px 18px;
        border-radius: 17px;
      }

      .zodiac-title {
        font-size: 26px;
      }

      .section-title {
        font-size: 20px;
      }

      .section p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

        <option value="aries">

  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /*
      ============================================
      MAUKSH-DATA HOROSCOPE SOURCE
      ============================================

      This is a SEPARATE GitHub repository.

      Repository:
      theastrobhaiya-debug/Mauksh-data

      File:
      Horoscope.json
    */

    const HOROSCOPE_URL =
      "https://raw.githubusercontent.com/theastrobhaiya-debug/Mauksh-data/main/Horoscope.json";


    const zodiacSelect =
      document.getElementById("zodiacSelect");

    const horoscopeContent =
      document.getElementById("horoscopeContent");

    const horoscopeStatus =
      document.getElementById("horoscopeStatus");

    const horoscopeDate =
      document.getElementById("horoscopeDate");


    /*
      ============================================
      LOAD HOROSCOPE
      ============================================
    */

    async function loadHoroscope() {

      try {

        horoscopeStatus.textContent =
          "Loading today's horoscope...";

        const response =
          await fetch(
            HOROSCOPE_URL + "?v=" + Date.now()
          );

        if (!response.ok) {

          throw new Error(
            "Horoscope JSON returned HTTP " +
            response.status
          );

        }

        const data =
          await response.json();


        /*
          Save globally so changing the
          zodiac does not fetch the file again.
        */

        window.horoscopeData = data;


        /*
          Date
        */

        if (data.date) {

          horoscopeDate.textContent =
            data.date;

        } else {

          horoscopeDate.textContent =
            "Today";

        }


        horoscopeStatus.textContent = "";


        /*
          Show first selected zodiac
        */

        showHoroscope(
          zodiacSelect.value
        );

      }

      catch (error) {

        console.error(
          "Horoscope loading error:",
          error
        );

        horoscopeStatus.textContent =
          "Daily horoscope is temporarily unavailable.";

        horoscopeContent.innerHTML = `
          <div class="section">
            <div class="section-title">
              Please try again
            </div>

            <p>
              We couldn't load today's horoscope.
              Please refresh the page in a moment.
            </p>
          </div>
        `;

      }

    }


    /*
      ============================================
      DISPLAY HOROSCOPE
      ============================================
    */

    function showHoroscope(sign) {

      if (
        !window.horoscopeData ||
        !window.horoscopeData[sign]
      ) {

        horoscopeContent.innerHTML = `
          <div class="section">
            <div class="section-title">
              Horoscope unavailable
            </div>

            <p>
              No horoscope was found for this zodiac sign.
            </p>
          </div>
        `;

        return;
      }


      const rawHTML =
        window.horoscopeData[sign];


      /*
        Parse the HTML stored inside JSON.

        This prevents tags such as
        <h3> and <p> from appearing
        as visible text.
      */

      const parser =
        new DOMParser();

      const doc =
        parser.parseFromString(
          rawHTML,
          "text/html"
        );


      /*
        Zodiac heading
      */

      const heading =
        doc.querySelector("h3");


      /*
        All paragraphs
      */

      const paragraphs =
        Array.from(
          doc.querySelectorAll("p")
        );


      let zodiacTitle =
        heading
          ? heading.textContent.trim()
          : getZodiacName(sign);


      let html = `
        <div class="zodiac-title">
          ${escapeHTML(zodiacTitle)}
        </div>
      `;


      /*
        Convert each paragraph into
        a separate clean section.
      */

      paragraphs.forEach(
        paragraph => {

          const text =
            paragraph.textContent.trim();

          if (!text) return;


          const section =
            detectSection(text);


          if (section.type === "truth") {

            html += `
              <div class="truth-box">

                <div class="section-title">
                  ⚡ Mauksh Truth
                </div>

                <p>
                  ${escapeHTML(section.text)}
                </p>

              </div>
            `;

          } else {

            html += `
              <div class="section">

                <div class="section-title">
                  ${escapeHTML(section.title)}
                </div>

                <p>
                  ${escapeHTML(section.text)}
                </p>

              </div>
            `;

          }

        }
      );


      horoscopeContent.innerHTML =
        html;

    }


    /*
      ============================================
      DETECT SECTION
      ============================================
    */

    function detectSection(text) {

      const cleanText =
        text.trim();


      if (
        cleanText.startsWith("🔥 Energy:")
      ) {

        return {

          type: "normal",

          title: "🔥 Energy",

          text:
            cleanText
              .replace(
                /^🔥\s*Energy:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.startsWith("💼 Career:")
      ) {

        return {

          type: "normal",

          title: "💼 Career",

          text:
            cleanText
              .replace(
                /^💼\s*Career:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.startsWith("❤️ Love:")
      ) {

        return {

          type: "normal",

          title: "❤️ Love",

          text:
            cleanText
              .replace(
                /^❤️\s*Love:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.startsWith("💰 Money:")
      ) {

        return {

          type: "normal",

          title: "💰 Money",

          text:
            cleanText
              .replace(
                /^💰\s*Money:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.startsWith("🧘 Advice:")
      ) {

        return {

          type: "normal",

          title: "🧘 Advice",

          text:
            cleanText
              .replace(
                /^🧘\s*Advice:\s*/i,
                ""
              )
              .trim()

        };

      }


      if (
        cleanText.includes("Mauksh Truth:")
      ) {

        return {

          type: "truth",

          title: "⚡ Mauksh Truth",

          text:
            cleanText
              .replace(
                /^⚡\s*Mauksh Truth:\s*/i,
                ""
              )
              .trim()

        };

      }


      /*
        Fallback if a paragraph has
        unexpected formatting.
      */

      return {

        type: "normal",

        title: "Daily Guidance",

        text: cleanText

      };

    }


    /*
      ============================================
      ZODIAC NAMES
      ============================================
    */

    function getZodiacName(sign) {

      const names = {

        aries: "♈ Aries",

        taurus: "♉ Taurus",

        gemini: "♊ Gemini",

        cancer: "♋ Cancer",

        leo: "♌ Leo",

        virgo: "♍ Virgo",

        libra: "♎ Libra",

        scorpio: "♏ Scorpio",

        sagittarius: "♐ Sagittarius",

        capricorn: "♑ Capricorn",

        aquarius: "♒ Aquarius",

        pisces: "♓ Pisces"

      };


      return names[sign] || sign;

    }


    /*
      ============================================
      HTML ESCAPING
      ============================================
    */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      ============================================
      ZODIAC CHANGE
      ============================================
    */

    zodiacSelect.addEventListener(
      "change",
      function () {

        showHoroscope(
          this.value
        );

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );


    /*
      ============================================
      MOBILE MENU
      ============================================
    */

    const menuButton =
      document.getElementById("menuButton");

    const mainNav =
      document.getElementById("mainNav");


    menuButton.addEventListener(
      "click",
      function () {

        mainNav.classList.toggle("open");

      }
    );


    /*
      Close mobile menu after
      clicking a navigation link.
    */

    document
      .querySelectorAll("#mainNav a")
      .forEach(
        link => {

          link.addEventListener(
            "click",
            function () {

              mainNav.classList.remove(
                "open"
              );

            }
          );

        }
      );


    /*
      ============================================
      START
      ============================================
    */

    loadHoroscope();

  </script>

</body>
