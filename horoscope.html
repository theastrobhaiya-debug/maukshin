<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Horoscope | Kaaldarpan</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fffaf2;
  color: #3b2414;
  font-family: Georgia, "Times New Roman", serif;
}

/* HEADER */

header {
  text-align: center;
  padding: 25px 15px 20px;
  background: #fff4dc;
  border-bottom: 1px solid #e3c58d;
}

.logo {
  width: 76px;
  height: 76px;
  object-fit: contain;
}

.brand {
  margin: 8px 0 2px;
  font-size: 29px;
  color: #a85b08;
}

.by {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 1.4px;
  color: #765536;
  text-transform: uppercase;
}

/* NAV */

nav {
  text-align: center;
  padding: 14px;
  background: white;
  border-bottom: 1px solid #ead9ba;
}

nav a {
  margin: 0 9px;
  text-decoration: none;
  color: #77430b;
  font-family: Arial, sans-serif;
  font-size: 13px;
}

/* HERO */

.hero {
  text-align: center;
  padding: 38px 18px 25px;
}

.om {
  font-size: 28px;
  color: #c87508;
}

h1 {
  margin: 8px 0;
  font-size: 34px;
  color: #6f3907;
}

.subtitle {
  max-width: 650px;
  margin: auto;
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: #765f48;
}

.date {
  display: inline-block;
  margin-top: 18px;
  padding: 9px 16px;
  background: white;
  border: 1px solid #dfc18a;
  border-radius: 10px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: #70420e;
}

/* MAIN */

.container {
  width: min(94%, 760px);
  margin: auto;
  padding-bottom: 50px;
}

/* ZODIAC SELECT */

.select-label {
  display: block;
  margin-bottom: 8px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  font-weight: bold;
  color: #70420e;
}

select {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #dcb878;
  border-radius: 12px;
  background: white;
  color: #5d350b;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 16px;
  outline: none;
  cursor: pointer;
}

select:focus {
  border-color: #a85b08;
}

/* HOROSCOPE */

.horoscope {
  margin-top: 25px;
  background: white;
  border: 1px solid #ead7b5;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 4px 15px rgba(100,70,30,.06);
}

.sign-title {
  text-align: center;
  margin: 0 0 4px;
  color: #7a4107;
  font-size: 28px;
}

.sign-sanskrit {
  text-align: center;
  color: #9b7952;
  font-family: Arial, sans-serif;
  font-size: 12px;
  margin-bottom: 25px;
}

/* SECTION */

.section {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #eee0c9;
}

.section:first-child {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}

.section h3 {
  margin: 0 0 10px;
  color: #8b4d08;
  font-size: 19px;
}

.section p {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #4d3927;
  font-size: 14px;
  line-height: 1.8;
}

/* LOADING */

.loading {
  text-align: center;
  padding: 35px;
  color: #806d58;
  font-family: Arial, sans-serif;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 25px;
  background: #f6e6c8;
  border-top: 1px solid #dfc18a;
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: #765536;
}

footer strong {
  color: #9b5307;
}

/* MOBILE */

@media (max-width: 600px) {

  h1 {
    font-size: 29px;
  }

  .horoscope {
    padding: 20px;
  }

  .sign-title {
    font-size: 25px;
  }

}

</style>
</head>


<body>


<!-- HEADER -->

<header>

  <img
    src="assets/kaaldarpan-logo.png"
    class="logo"
    alt="Kaaldarpan"
  >

  <h2 class="brand">
    Kaaldarpan
  </h2>

  <div class="by">
    An initiative by Mauksh
  </div>

</header>


<!-- NAVIGATION -->

<nav>

  <a href="index.html">
    Panchang
  </a>

  <a href="horoscope.html">
    Daily Horoscope
  </a>

</nav>


<!-- HERO -->

<section class="hero">

  <div class="om">
    ॐ
  </div>

  <h1>
    Daily Horoscope
  </h1>

  <p class="subtitle">
    Your daily Vedic astrology guidance based on traditional
    Jyotish principles.
  </p>

  <div
    class="date"
    id="date">
  </div>

</section>


<!-- MAIN -->

<main class="container">


  <!-- DROPDOWN -->

  <label
    class="select-label"
    for="zodiac">

    Select your zodiac sign

  </label>


  <select id="zodiac">

    <option value="Aries">
      Aries — Mesha
    </option>

    <option value="Taurus">
      Taurus — Vrishabha
    </option>

    <option value="Gemini">
      Gemini — Mithuna
    </option>

    <option value="Cancer">
      Cancer — Karka
    </option>

    <option value="Leo">
      Leo — Simha
    </option>

    <option value="Virgo">
      Virgo — Kanya
    </option>

    <option value="Libra">
      Libra — Tula
    </option>

    <option value="Scorpio">
      Scorpio — Vrishchika
    </option>

    <option value="Sagittarius">
      Sagittarius — Dhanu
    </option>

    <option value="Capricorn">
      Capricorn — Makara
    </option>

    <option value="Aquarius">
      Aquarius — Kumbha
    </option>

    <option value="Pisces">
      Pisces — Meena
    </option>

  </select>


  <!-- HOROSCOPE -->

  <div
    class="horoscope"
    id="horoscope">

    <div class="loading">
      Loading today's horoscope...
    </div>

  </div>


</main>


<!-- FOOTER -->

<footer>

  <strong>
    Kaaldarpan
  </strong>

  <br>

  An initiative by Mauksh

</footer>


<script>


/* LIVE MAUKSH DATA */

const DATA_URL =
"https://raw.githubusercontent.com/theastrobhaiya-debug/Mauksh-data/main/Horoscope.json";


/* ZODIAC INFORMATION */

const zodiacInfo = {

  Aries: {
    sanskrit: "Mesha",
    symbol: "♈"
  },

  Taurus: {
    sanskrit: "Vrishabha",
    symbol: "♉"
  },

  Gemini: {
    sanskrit: "Mithuna",
    symbol: "♊"
  },

  Cancer: {
    sanskrit: "Karka",
    symbol: "♋"
  },

  Leo: {
    sanskrit: "Simha",
    symbol: "♌"
  },

  Virgo: {
    sanskrit: "Kanya",
    symbol: "♍"
  },

  Libra: {
    sanskrit: "Tula",
    symbol: "♎"
  },

  Scorpio: {
    sanskrit: "Vrishchika",
    symbol: "♏"
  },

  Sagittarius: {
    sanskrit: "Dhanu",
    symbol: "♐"
  },

  Capricorn: {
    sanskrit: "Makara",
    symbol: "♑"
  },

  Aquarius: {
    sanskrit: "Kumbha",
    symbol: "♒"
  },

  Pisces: {
    sanskrit: "Meena",
    symbol: "♓"
  }

};


/* DATE */

document.getElementById("date").textContent =
new Date().toLocaleDateString(
  "en-IN",
  {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  }
);


/* REMOVE UNWANTED HTML */

function cleanText(text) {

  if (!text) {
    return "";
  }

  let div =
  document.createElement("div");

  div.innerHTML = String(text);

  return div.textContent
    .replace(/\s+/g, " ")
    .trim();

}


/* FIND ZODIAC DATA */

function findSign(data, sign) {

  const sources = [

    data.horoscope,

    data.predictions,

    data.signs,

    data.zodiac,

    data

  ];


  for (const source of sources) {

    if (
      !source ||
      typeof source !== "object"
    ) {
      continue;
    }


    const key =
    Object.keys(source).find(function(k) {

      return k
        .toLowerCase()
        .replace(/[^a-z]/g, "") ===
        sign.toLowerCase();

    });


    if (key) {

      return source[key];

    }

  }


  return null;

}


/* CREATE SECTIONS FROM HTML */

function createSections(value) {

  if (!value) {
    return "";
  }


  let html =
  String(value);


  /*
    Convert common HTML headings
    into clean horoscope sections
  */

  html = html.replace(
    /<h[1-6][^>]*>(.*?)<\/h[1-6]>/gis,
    function(match, heading) {

      return "|||SECTION|||" +
        cleanText(heading) +
        "|||ENDHEADING|||";

    }
  );


  html = html.replace(
    /<br\s*\/?>/gi,
    "\n"
  );


  html = html.replace(
    /<\/p>/gi,
    "\n"
  );


  html = html.replace(
    /<\/div>/gi,
    "\n"
  );


  html = cleanText(html);


  const parts =
  html.split("|||SECTION|||");


  let result = "";


  for (let part of parts) {

    part = part.trim();

    if (!part) {
      continue;
    }


    if (
      part.includes("|||ENDHEADING|||")
    ) {

      const pieces =
      part.split("|||ENDHEADING|||");

      const heading =
      pieces[0].trim();

      const text =
      pieces
        .slice(1)
        .join(" ")
        .trim();


      result += `

        <div class="section">

          <h3>
            ${escapeHtml(heading)}
          </h3>

          <p>
            ${escapeHtml(text)}
          </p>

        </div>

      `;

    }

    else {

      result += `

        <div class="section">

          <p>
            ${escapeHtml(part)}
          </p>

        </div>

      `;

    }

  }


  return result;

}


/* ESCAPE TEXT */

function escapeHtml(text) {

  return String(text).replace(
    /[&<>'"]/g,
    function(c) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"

      }[c];

    }
  );

}


/* DISPLAY */

function displaySign(data, sign) {

  const info =
  zodiacInfo[sign];


  const value =
  findSign(data, sign);


  const horoscope =
  document.getElementById("horoscope");


  let rawText = "";


  if (typeof value === "string") {

    rawText = value;

  }

  else if (
    value &&
    typeof value === "object"
  ) {

    rawText =
      value.prediction ||
      value.horoscope ||
      value.text ||
      value.content ||
      "";

  }


  const sections =
  createSections(rawText);


  horoscope.innerHTML = `

    <h2 class="sign-title">

      ${info.symbol}
      ${sign}

    </h2>

    <div class="sign-sanskrit">

      ${info.sanskrit}

    </div>

    ${
      sections ||
      `
      <div class="loading">
        Horoscope is being updated.
      </div>
      `
    }

  `;

}


/* LOAD JSON */

let horoscopeData = null;


fetch(
  DATA_URL + "?v=" + Date.now(),
  {
    cache: "no-store"
  }
)

.then(function(response) {

  if (!response.ok) {

    throw new Error(
      "Could not load Horoscope.json"
    );

  }

  return response.json();

})

.then(function(data) {

  horoscopeData = data;


  const selected =
  document.getElementById("zodiac").value;


  displaySign(
    horoscopeData,
    selected
  );

})

.catch(function(error) {

  console.error(error);


  document.getElementById("horoscope").innerHTML = `

    <div class="loading">

      Unable to load today's horoscope.
      Please try again shortly.

    </div>

  `;

});


/* DROPDOWN CHANGE */

document
.getElementById("zodiac")
.addEventListener(
  "change",
  function() {

    if (!horoscopeData) {
      return;
    }


    displaySign(
      horoscopeData,
      this.value
    );

  }
);


</script>

</body>
</html>
