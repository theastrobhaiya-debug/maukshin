<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Horoscope | Kaaldarpan</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #faf7f0;
  color: #2d2118;
  font-family: Arial, sans-serif;
}
.header {
  text-align: center;
  padding: 28px 20px 22px;
  background: #fffdf8;
}
.logo {
  width: 70px;
  height: 70px;
  object-fit: contain;
}
.brand {
  margin: 8px 0 3px;
  font-family: Georgia, serif;
  font-size: 28px;
  color: #8b520f;
}
.by {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #8b7964;
}
.nav {
  text-align: center;
  padding: 13px;
  background: #fff;
  border-top: 1px solid #eee5d6;
  border-bottom: 1px solid #eee5d6;
}
.nav a {
  margin: 0 10px;
  text-decoration: none;
  color: #76501d;
  font-size: 13px;
}
.hero {
  max-width: 760px;
  margin: auto;
  text-align: center;
  padding: 48px 20px 28px;
}
.hero-symbol {
  font-size: 26px;
  color: #a96a16;
}
h1 {
  margin: 10px 0;
  font-family: Georgia, serif;
  font-size: 38px;
  font-weight: normal;
  color: #3d2a1b;
}
.subtitle {
  max-width: 620px;
  margin: auto;
  color: #776a5d;
  font-size: 14px;
  line-height: 1.7;
}
.date {
  margin-top: 18px;
  font-size: 13px;
  color: #8a6a40;
}
.container {
  width: min(92%, 760px);
  margin: auto;
  padding-bottom: 60px;
}
.label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  color: #655443;
}
select {
  width: 100%;
  padding: 15px 16px;
  border: 1px solid #d8c6a8;
  border-radius: 10px;
  background: #fff;
  color: #3c2c1e;
  font-size: 15px;
  outline: none;
}
.horoscope {
  margin-top: 28px;
  background: #fff;
  border: 1px solid #eee3d1;
  border-radius: 14px;
  padding: 30px;
}
.sign {
  text-align: center;
  margin: 0;
  font-family: Georgia, serif;
  font-size: 29px;
  font-weight: normal;
  color: #70430e;
}
.moon-sign {
  text-align: center;
  margin-top: 5px;
  color: #9b8060;
  font-size: 12px;
}
.section {
  margin-top: 32px;
}
.section h2 {
  margin: 0 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #eee3d1;
  font-family: Georgia, serif;
  font-size: 20px;
  font-weight: normal;
  color: #86500f;
}
.section p {
  margin: 0;
  color: #4d4034;
  font-size: 14px;
  line-height: 1.85;
}
.loading {
  text-align: center;
  padding: 35px 10px;
  color: #8a7b6b;
  font-size: 14px;
}
footer {
  text-align: center;
  padding: 25px;
  background: #f1e7d7;
  color: #806f5c;
  font-size: 12px;
}
footer strong {
  color: #8b520f;
}
@media (max-width: 600px) {
  .hero {
    padding-top: 35px;
  }
  h1 {
    font-size: 31px;
  }
  .horoscope {
    padding: 22px 18px;
  }
  .sign {
    font-size: 26px;
  }
}
</style>
</head>
<body>
<header class="header">
  <img
    src="assets/kaaldarpan-logo.png"
    class="logo"
    alt="Kaaldarpan"
  >
  <div class="brand">
    Kaaldarpan
  </div>
  <div class="by">
    An initiative by Mauksh
  </div>
</header>
<nav class="nav">
  <a href="index.html">Panchang</a>
  <a href="horoscope.html">Daily Horoscope</a>
</nav>
<section class="hero">
  <div class="hero-symbol">ॐ</div>
  <h1>Daily Horoscope</h1>
  <p class="subtitle">
    Daily Vedic astrology guidance based on planetary
    movements and traditional Jyotish principles.
  </p>
  <div class="date" id="date"></div>
</section>
<main class="container">
  <label class="label" for="zodiac">
    Select your Zodiac / Moon Sign
  </label>
  <select id="zodiac">
    <option value="Aries">Aries — Mesha</option>
    <option value="Taurus">Taurus — Vrishabha</option>
    <option value="Gemini">Gemini — Mithuna</option>
    <option value="Cancer">Cancer — Karka</option>
    <option value="Leo">Leo — Simha</option>
    <option value="Virgo">Virgo — Kanya</option>
    <option value="Libra">Libra — Tula</option>
    <option value="Scorpio">Scorpio — Vrishchika</option>
    <option value="Sagittarius">Sagittarius — Dhanu</option>
    <option value="Capricorn">Capricorn — Makara</option>
    <option value="Aquarius">Aquarius — Kumbha</option>
    <option value="Pisces">Pisces — Meena</option>
  </select>
  <div class="horoscope" id="horoscope">
    <div class="loading">
      Loading today's horoscope...
    </div>
  </div>
</main>
<footer>
  <strong>Kaaldarpan</strong>
  <br>
  An initiative by Mauksh
</footer>
<script>
const DATA_URL =
"https://raw.githubusercontent.com/theastrobhaiya-debug/Mauksh-data/main/Horoscope.json";
const zodiac = {
  Aries: ["Mesha", "♈"],
  Taurus: ["Vrishabha", "♉"],
  Gemini: ["Mithuna", "♊"],
  Cancer: ["Karka", "♋"],
  Leo: ["Simha", "♌"],
  Virgo: ["Kanya", "♍"],
  Libra: ["Tula", "♎"],
  Scorpio: ["Vrishchika", "♏"],
  Sagittarius: ["Dhanu", "♐"],
  Capricorn: ["Makara", "♑"],
  Aquarius: ["Kumbha", "♒"],
  Pisces: ["Meena", "♓"]
};
document.getElementById("date").textContent =
new Date().toLocaleDateString("en-IN", {
  weekday: "long",
  year: "numeric",
  month: "long",
  day: "numeric"
});
function getSignData(data, sign) {
  const sources = [
    data,
    data.horoscope,
    data.predictions,
    data.zodiac,
    data.signs
  ];
  for (const source of sources) {
    if (!source || typeof source !== "object") {
      continue;
    }
    const key = Object.keys(source).find(k =>
      k.toLowerCase().replace(/[^a-z]/g, "") ===
      sign.toLowerCase()
    );
    if (key) {
      return source[key];
    }
  }
  return null;
}
function text(value) {
  if (value === undefined || value === null) {
    return "";
  }
  const div = document.createElement("div");
  div.innerHTML = String(value);
  return div.textContent
    .replace(/\s+/g, " ")
    .trim();
}
function getField(data, names) {
  if (!data || typeof data !== "object") {
    return "";
  }
  for (const name of names) {
    const key = Object.keys(data).find(k =>
      k.toLowerCase().replace(/[^a-z]/g, "") ===
      name.toLowerCase().replace(/[^a-z]/g, "")
    );
    if (key) {
      return text(data[key]);
    }
  }
  return "";
}
function display(signData, sign) {
  const info = zodiac[sign];
  const horoscope =
    document.getElementById("horoscope");
  if (!signData) {
    horoscope.innerHTML = `
      <div class="loading">
        Horoscope unavailable for this zodiac sign.
      </div>
    `;
    return;
  }
  /*
   * These fields are deliberately kept separate.
   */
  const career = getField(signData, [
    "career",
    "career_prediction",
    "work",
    "professional"
  ]);
  const love = getField(signData, [
    "love",
    "love_prediction",
    "relationship",
    "relationships"
  ]);
  const finance = getField(signData, [
    "finance",
    "finances",
    "financial",
    "money",
    "finance_prediction"
  ]);
  const health = getField(signData, [
    "health",
    "health_prediction",
    "wellness"
  ]);
  const guidance = getField(signData, [
    "guidance",
    "practical_guidance",
    "advice",
    "overall",
    "prediction"
  ]);
  let html = `
    <h2 class="sign">
      ${info[1]} ${sign}
    </h2>
    <div class="moon-sign">
      Moon Sign — ${info[0]}
    </div>
  `;
  if (career) {
    html += `
      <section class="section">
        <h2>Career</h2>
        <p>${career}</p>
      </section>
    `;
  }
  if (love) {
    html += `
      <section class="section">
        <h2>Love</h2>
        <p>${love}</p>
      </section>
    `;
  }
  if (finance) {
    html += `
      <section class="section">
        <h2>Finances</h2>
        <p>${finance}</p>
      </section>
    `;
  }
  if (health) {
    html += `
      <section class="section">
        <h2>Health</h2>
        <p>${health}</p>
      </section>
    `;
  }
  if (guidance) {
    html += `
      <section class="section">
        <h2>Practical Guidance</h2>
        <p>${guidance}</p>
      </section>
    `;
  }
  if (!career && !love && !finance && !health && !guidance) {
    html += `
      <div class="loading">
        Today's horoscope is being updated.
      </div>
    `;
  }
  horoscope.innerHTML = html;
}
let horoscopeData = null;
fetch(DATA_URL + "?v=" + Date.now(), {
  cache: "no-store"
})
.then(response => {
  if (!response.ok) {
    throw new Error("Horoscope data unavailable");
  }
  return response.json();
})
.then(data => {
  horoscopeData = data;
  const sign =
    document.getElementById("zodiac").value;
  display(
    getSignData(data, sign),
    sign
  );
})
.catch(error => {
  console.error(error);
  document.getElementById("horoscope").innerHTML = `
    <div class="loading">
      Unable to load today's horoscope.
    </div>
  `;
});
document
.getElementById("zodiac")
.addEventListener("change", function() {
  if (!horoscopeData) {
    return;
  }
  const sign = this.value;
  display(
    getSignData(horoscopeData, sign),
    sign
  );
});
</script>
</body>
</html>
